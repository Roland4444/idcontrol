[package]
name = "id-control-axum"
version = "0.7.0"
edition = "2021"
description = "Executive documentation control with local rules and optional AI review"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
calamine = "0.26"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
html-escape = "0.2"
http = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
hayro = "0.8"
once_cell = "1"
# rapidocr-core 0.2.2 uses Session::builder() without &Environment.
# ort 2.0.0-rc.14 BREAKS that API: do not update ort until rapidocr-core is upgraded.
rapidocr-core = { version = "=0.2.2", default-features = false }
ort = "=2.0.0-rc.12"
regex = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "migrate", "macros"] }
strsim = "0.11"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
walkdir = "2"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rust_xlsxwriter = "0.79"

[profile.release]
lto = "thin"
codegen-units = 1
